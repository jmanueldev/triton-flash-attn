[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-flash-attn"
version = "0.1.0"
description = "Contributed Triton FlashAttention extensions and hardware-efficient CUDA kernels."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "triton>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "triton",
]